# ===========================================
# Marketing Listener Service (Consumer)
# ===========================================

# No web server needed — this is a pure Kafka listener
spring.main.web-application-type=none

# --- Kafka Consumer Configuration ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=marketing-listener-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Trust the event package from the producer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Map the producer's type to the consumer's own DTO class
spring.kafka.consumer.properties.spring.json.value.default.type=dev.marketing.listener.event.PropertyRegisteredEvent

# Remap the producer's class name to the consumer's local DTO class
spring.kafka.consumer.properties.spring.json.type.mapping=dev.inventory.propertyonboarding.domain.event.PropertyRegisteredEvent:dev.marketing.listener.event.PropertyRegisteredEvent

# --- Application: Kafka Topic ---
app.kafka.topic=property-onboarding-events
